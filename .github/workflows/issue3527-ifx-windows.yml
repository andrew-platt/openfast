# Throwaway workflow for OpenFAST issue #3527: build TurbSim on Windows with ifx and keep the executable.
name: issue3527-turbsim-ifx-windows
on: push

jobs:
  build-turbsim-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release tags (for the version string)
        shell: cmd
        run: git fetch https://github.com/OpenFAST/openfast.git --tags

      - name: Test devenv actually works
        shell: cmd
        run: .github/scripts/windows_devenv_test.bat

      - name: Install Intel Fortran Essentials (Windows)
        shell: cmd
        env:
          URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/33676fcf-14a3-4e96-a9b9-72976b1145d9/intel-fortran-essentials-2025.3.1.25_offline.exe
        run: |
          curl.exe --output %TEMP%\webimage.exe --url %URL% --retry 5 --retry-delay 5
          %TEMP%\webimage.exe -s -a --silent --eula accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=1 --log-dir=.
          set installer_exit_code=%ERRORLEVEL%
          exit /b %installer_exit_code%

      - name: Build TurbSim
        shell: cmd
        run: .github/issue3527/build.bat

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: TurbSim-issue3527-windows-ifx
          path: |
            build/bin/TurbSim*.exe
            build/bin/*.dll
          if-no-files-found: error
          retention-days: 90

      - name: Checks with ifx
        shell: cmd
        run: .github/issue3527/checks.bat
